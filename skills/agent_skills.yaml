# Agent Skill Registry
# Central, editable source of truth for specialist agent routing.
# Used by agents/team/skill_registry.py (load_skill_registry).
#
# Each skill defines:
#   name          - unique skill identifier
#   category      - routing category (must match SpecialistAgent.category)
#   agent         - import path to the agent class "module:ClassName"
#   prompt        - path to the expert prompt file
#   keywords      - trigger keywords used for task classification
#   capabilities  - capability identifiers advertised by the specialist
#   version       - skill definition version
#   enabled       - set to false to exclude the skill from routing

version: "1.0"

skills:
  - name: malware
    category: malware
    agent: "agents.team.specialists.malware_agent:MalwareAnalysisAgent"
    prompt: "prompts/malware_expert.md"
    keywords: [malware, virus, trojan, ransomware, backdoor, payload, pe file, pe header, windows executable, executable, dll, dll analysis, dynamic link library]
    capabilities:
      - pe_analysis
      - ioc_extraction
      - malware_indicator_analysis
      - static_analysis
      - dynamic_analysis_guidance
    version: "1.0"
    enabled: true

  - name: web
    category: web
    agent: "agents.team.specialists.web_agent:WebSecurityAgent"
    prompt: "prompts/web_expert.md"
    keywords: [web, http, url, xss, sql injection, csrf, api, endpoint, cookie, session]
    capabilities:
      - http_analysis
      - vulnerability_pattern_analysis
      - request_analysis
      - owasp_top_ten_check
      - parameter_fuzzing_guidance
    version: "1.0"
    enabled: true

  - name: crypto
